name: Showcase app

# Every push: analyze and test the library and the showcase, build the Android
# showcase APK. On the default branch the APK also replaces the one on the
# rolling "debug" pre-release, where the app's updater finds it
# (example/lib/updater). Other branches keep their APK as a run artifact.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Library - analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Showcase - analyze and test
        working-directory: example
        run: |
          flutter analyze
          flutter test

      # Release mode (small and fast), signed with the public showcase key so
      # each build installs over the last. The run number is the build number
      # the updater compares.
      - name: Build APK
        working-directory: example
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=0.1.${{ github.run_number }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=COMMIT=${GITHUB_SHA::7}
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/kakao-showcase.apk"

      - name: Describe the build
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          jq -n \
            --argjson build ${{ github.run_number }} \
            --arg commit "${GITHUB_SHA::7}" \
            --arg message "$(printf '%s' "$MESSAGE" | head -n 1)" \
            --arg apk "https://github.com/${{ github.repository }}/releases/download/debug/kakao-showcase.apk" \
            '{build: $build, commit: $commit, message: $message, apk: $apk}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: kakao-showcase-${{ github.run_number }}
          path: |
            kakao-showcase.apk
            version.json

      # Upload the APK first and version.json last: the app only sees the new
      # build once its APK is in place.
      - name: Publish to the rolling debug release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f debug
          git push -f origin refs/tags/debug
          if ! gh release view debug >/dev/null 2>&1; then
            gh release create debug --prerelease --verify-tag \
              --title "Showcase debug build" \
              --notes "Rolling build of the showcase app, replaced on every push to the default branch."
          fi
          gh release upload debug kakao-showcase.apk --clobber
          gh release upload debug version.json --clobber
          gh release edit debug --title "Showcase build ${{ github.run_number }} (${GITHUB_SHA::7})"
